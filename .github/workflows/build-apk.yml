name: Build APK

on:
  push:
    branches: [main, claude/donna-scheduling-assistant-a52Nj]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu-latest runner ships with Android SDK at $ANDROID_HOME.
      # We just need to accept licences and ensure platform-35 + build-tools are present.
      - name: Accept Android SDK licences & install platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          echo "VITE_ANTHROPIC_API_KEY=build-placeholder" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=build-placeholder" >> .env

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: donna-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
